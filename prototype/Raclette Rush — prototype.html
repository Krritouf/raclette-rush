<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Raclette Rush — prototype</title>
<style>
html,body{margin:0;height:100%;background:#a9d3f0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, S, dpr;
const VH = 600;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  S = H / VH;
}
addEventListener('resize', resize); resize();

// ---------- Réglages ----------
const G = 1400;            // gravité
const JUMP = 600;          // impulsion de saut
const R = 22;              // rayon de la meule
const ROLL_DRAG = 0.12;    // frottement au sol
const MAX_SPEED = 950;
const PORTIONS = 4;        // nombre de chocs encaissables
const STEP = 20;

const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

// ---------- Montagne procédurale ----------
let gy, genX, slope, target, feat, featLeft, obstacles, potatoes, nextObsX, nextPotX, deco;

const OBST = {
  rock:  { w: 34, h: 24, dmg: 1, slow: 0.55, name: 'Caillou' },
  fence: { w: 56, h: 34, dmg: 1, slow: 0.45, name: 'Barrière' },
  tree:  { w: 30, h: 78, dmg: 1, slow: 0.3,  name: 'Sapin' },
  cow:   { w: 78, h: 52, dmg: 2, slow: 0.2,  name: 'Vache' },
};

function resetMountain(){
  gy = []; genX = 0; slope = 0.3; target = 0.3; feat = 'normal'; featLeft = 30;
  obstacles = []; potatoes = []; nextObsX = 900; nextPotX = 500; deco = [];
  let y = 200;
  gy.push(y);
}
function genTo(x){
  while (genX <= x + STEP*2){
    const d = genX;
    const diff = Math.min(1, d / 30000);
    let y = gy[gy.length-1];
    if (featLeft <= 0){
      const r = Math.random();
      if (d < 600){ feat = 'normal'; featLeft = 10; }
      else if (r < 0.50){ feat = 'normal'; featLeft = Math.floor(rnd(12, 35)); target = rnd(0.22, 0.5 + 0.25*diff); }
      else if (r < 0.68 && feat !== 'flat'){ feat = 'kicker'; featLeft = Math.floor(rnd(4, 7)); }
      else if (r < 0.84){ feat = 'cliff'; featLeft = 1; }
      else { feat = 'flat'; featLeft = Math.floor(rnd(8, 18)); target = rnd(0.02, 0.1); }
    }
    if (feat === 'kicker'){ slope += (-0.45 - slope)*0.5; }
    else if (feat === 'cliff'){ y += rnd(70, 140 + 80*diff); slope = target; }
    else { slope += (target - slope)*0.2 + rnd(-0.06, 0.06); }
    if (feat === 'kicker' && featLeft === 1) target = rnd(0.3, 0.55);
    y += slope * STEP;
    featLeft--;
    gy.push(y);
    genX += STEP;
    const nx = genX;

    // obstacles
    if (nx > nextObsX && (feat === 'normal' || feat === 'flat') && featLeft > 3){
      const pool = nx < 3000 ? ['rock','rock','fence'] : nx < 8000 ? ['rock','fence','tree','tree'] : ['rock','fence','tree','cow','cow'];
      const t = pool[Math.floor(Math.random()*pool.length)];
      obstacles.push({ x: nx, t, hit: false, rot: 0 });
      nextObsX = nx + rnd(420 - 200*diff, 900 - 400*diff);
    }
    // pommes de terre (en arc, parfois en hauteur)
    if (nx > nextPotX && feat !== 'cliff'){
      const n = Math.floor(rnd(3, 7)), high = Math.random() < 0.4;
      for (let i=0;i<n;i++){
        const px = nx + i*34;
        potatoes.push({ x: px, dy: (high ? 90 : 40) + Math.sin(i/(n-1)*Math.PI)*(high ? 40 : 20), got: false });
      }
      nextPotX = nx + rnd(500, 1100);
    }
    // décor : sapins d'arrière-plan
    if (Math.random() < 0.12) deco.push({ x: nx + rnd(-10,10), s: rnd(0.5, 1.1), back: Math.random() < 0.5 });
  }
}
function groundAt(x){
  if (x < 0) x = 0;
  genTo(x);
  const fi = x / STEP, i = Math.floor(fi), t = fi - i;
  return gy[i] + (gy[i+1] - gy[i]) * t;
}
function slopeAt(x){ return (groundAt(x+4) - groundAt(x-4)) / 8; }

// ---------- État ----------
let m, state, cam, deathT, particles, texts, score, pots, best, shake, holding, jumpBuf, coyote, deadMsg;
try { best = +localStorage.getItem('raclette_best') || 0; } catch(e){ best = 0; }

function reset(){
  resetMountain();
  genTo(2500);
  m = { x: 120, y: groundAt(120) - R, vx: 0, vy: 0, a: 0, portions: PORTIONS, grounded: true, lost: [] , inv: 0};
  state = 'ready'; cam = { x: 0, y: m.y - VH*0.45 };
  particles = []; texts = []; score = 0; pots = 0; shake = 0; holding = false;
  jumpBuf = 0; coyote = 0; deathT = 0;
}
reset();

// ---------- Contrôles ----------
function press(){
  holding = true;
  if (state === 'dead'){ if (deathT > 0.7) reset(); return; }
  if (state === 'ready'){ state = 'play'; m.vx = 220; return; }
  jumpBuf = 0.13;
}
function release(){
  holding = false;
  // saut variable : relâcher tôt coupe le saut
  if (state === 'play' && m.vy < -150) m.vy *= 0.5;
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat){ e.preventDefault(); press(); } });
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') release(); });

function burst(x, y, cols, n, spd){
  for (let i=0;i<n;i++){
    const a = rnd(-Math.PI, 0), s = rnd(spd*0.3, spd);
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rnd(0.4,0.9), c: cols[i % cols.length], sz: rnd(3,6) });
  }
}
function popText(x, y, s, col){ texts.push({ x, y, s, col, life: 1.1 }); }

function hitObstacle(o){
  const def = OBST[o.t];
  o.hit = true;
  m.portions -= def.dmg;
  m.vx *= def.slow;
  m.vy = Math.min(m.vy, 0) - 220;
  m.inv = 0.5;
  shake = 0.35;
  burst(m.x, m.y, ['#f6d36b','#ffe9a6','#c9832c'], 22, 380);
  if (o.t === 'tree' || o.t === 'fence') burst(o.x + def.w/2, groundAt(o.x) - def.h/2, ['#2f6b3a','#7a5230'], 12, 250);
  popText(m.x, m.y - 40, o.t === 'cow' ? 'Meuh !' : 'Aïe !', '#fff');
  if (m.portions <= 0){
    state = 'dead'; deathT = 0;
    deadMsg = o.t === 'cow' ? 'Une vache a eu ta meule…' : 'La meule est en miettes !';
    burst(m.x, m.y, ['#f6d36b','#ffe9a6','#c9832c'], 40, 500);
    if (score > best){ best = score; try { localStorage.setItem('raclette_best', String(best)); } catch(e){} }
  }
}

// ---------- Physique ----------
function step(dt){
  m.vy += G*dt;
  m.x += m.vx*dt; m.y += m.vy*dt;

  const g = groundAt(m.x);
  const s = slopeAt(m.x);
  const nl = Math.hypot(s, 1), nx = s/nl, ny = -1/nl;      // normale vers le haut
  const lift = R * Math.min(nl, 1.6);   // hauteur du centre au-dessus du sol sur une pente
  const wasGrounded = m.grounded;
  m.grounded = false;
  if (m.y + lift > g - 0.5){
    m.y = g - lift;
    const vn = m.vx*nx + m.vy*ny;
    if (vn < 0){
      const bounce = vn < -350 ? 0.25 : 0;
      m.vx -= (1+bounce)*vn*nx; m.vy -= (1+bounce)*vn*ny;
      if (!wasGrounded && vn < -300) burst(m.x, g, ['#e9f5ff','#cfe8c2'], 6, 140);
    }
    m.grounded = true;
    // frottement de roulement
    m.vx *= (1 - ROLL_DRAG*dt); m.vy *= (1 - ROLL_DRAG*dt);
  }
  const sp = Math.hypot(m.vx, m.vy);
  if (sp > MAX_SPEED){ m.vx *= MAX_SPEED/sp; m.vy *= MAX_SPEED/sp; }
  // élan minimum : la meule ne reste jamais plantée dans un creux
  if (m.grounded && m.vx < 260 && state === 'play') m.vx += 750*dt;

  // obstacles
  if (m.inv <= 0){
    for (const o of obstacles){
      if (o.hit) continue;
      const def = OBST[o.t];
      if (o.x > m.x + 120) break;
      const base = groundAt(o.x + def.w/2);
      const rx0 = o.x, rx1 = o.x + def.w, ry0 = base - def.h, ry1 = base;
      const cx = clamp(m.x, rx0, rx1), cy = clamp(m.y, ry0, ry1);
      const shrink = 0.8;   // un peu d'indulgence
      if (Math.hypot(m.x - cx, m.y - cy) < R*shrink){ hitObstacle(o); return; }
    }
  }
}

function update(dt){
  if (state === 'play'){
    jumpBuf -= dt; coyote -= dt; m.inv -= dt;
    const sub = 4;
    for (let i=0;i<sub && state==='play';i++){
      step(dt/sub);
      if (m.grounded) coyote = 0.1;
      if (jumpBuf > 0 && coyote > 0){
        m.vy = -JUMP; m.y -= 2; m.grounded = false; jumpBuf = 0; coyote = 0;
        burst(m.x, m.y + R, ['#e9f5ff','#cfe8c2'], 6, 120);
      }
    }
    m.a += (m.vx / R) * dt;
    score = Math.max(score, Math.floor((m.x - 120) / 10));
    // pommes de terre
    for (const p of potatoes){
      if (p.got || p.x < m.x - 60 || p.x > m.x + 60) continue;
      const py = groundAt(p.x) - p.dy;
      if (Math.hypot(p.x - m.x, py - m.y) < R + 12){
        p.got = true; pots++;
        burst(p.x, py, ['#d9a85b','#f0d29a'], 6, 150);
      }
    }
    if (obstacles.length > 60) obstacles = obstacles.filter(o => o.x > cam.x - 200);
    if (potatoes.length > 120) potatoes = potatoes.filter(p => p.x > cam.x - 200);
    if (deco.length > 200) deco = deco.filter(d => d.x > cam.x - 400);
  }
  if (state === 'dead') deathT += dt;
  // obstacles percutés : basculent
  for (const o of obstacles) if (o.hit && o.rot < 1.3) o.rot += dt*4;
  for (const q of particles){ q.vy += 1100*dt; q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  for (const t of texts){ t.y -= 50*dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  shake = Math.max(0, shake - dt);

  // caméra : un peu d'avance selon la vitesse
  const viewW = W / S;
  const tx = m.x - viewW*(0.3 - Math.min(0.1, m.vx/9000));
  const ty = m.y - VH*0.42;
  cam.x += (tx - cam.x) * Math.min(1, dt*7);
  cam.y += (ty - cam.y) * Math.min(1, dt*5);
  genTo(cam.x + viewW + 400);
}

// ---------- Rendu ----------
function mountains(off, base, amp, col, snow, seed){
  const viewW = W / S;
  ctx.beginPath();
  ctx.moveTo(0, VH);
  for (let sx = 0; sx <= viewW + 20; sx += 10){
    const x = sx + off;
    const h = Math.abs(Math.sin(x*0.004 + seed))*amp + Math.abs(Math.sin(x*0.011 + seed*2))*amp*0.4;
    ctx.lineTo(sx, base - h);
  }
  ctx.lineTo(viewW + 20, VH); ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  if (snow){
    ctx.save(); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(0, 0, viewW + 20, base - amp*0.95);
    ctx.restore();
  }
}

function drawObstacle(o){
  const def = OBST[o.t];
  const bx = o.x + def.w/2, by = groundAt(bx);
  ctx.save();
  ctx.translate(bx, by);
  if (o.hit) ctx.rotate(Math.min(1.3, o.rot) * (o.t === 'rock' ? 0.3 : 1));
  if (o.t === 'rock'){
    ctx.fillStyle = '#8b8f98';
    ctx.beginPath(); ctx.moveTo(-17,2); ctx.lineTo(-13,-16); ctx.lineTo(-2,-24); ctx.lineTo(12,-19); ctx.lineTo(17,2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a9adb5'; ctx.beginPath(); ctx.moveTo(-10,-14); ctx.lineTo(-2,-21); ctx.lineTo(6,-17); ctx.lineTo(-4,-12); ctx.closePath(); ctx.fill();
  } else if (o.t === 'tree'){
    ctx.fillStyle = '#6b4526'; ctx.fillRect(-4, -14, 8, 16);
    ctx.fillStyle = '#245c33';
    for (let i=0;i<3;i++){
      const yb = -12 - i*20, w = 17 - i*4;
      ctx.beginPath(); ctx.moveTo(-w, yb); ctx.lineTo(0, yb - 30); ctx.lineTo(w, yb); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-5,-70); ctx.lineTo(0,-78); ctx.lineTo(5,-70); ctx.closePath(); ctx.fill();
  } else if (o.t === 'fence'){
    ctx.fillStyle = '#8a5a2e';
    for (const px of [-26, 0, 24]) ctx.fillRect(px-3, -34, 6, 36);
    ctx.fillStyle = '#a8713c';
    ctx.fillRect(-28, -28, 56, 5); ctx.fillRect(-28, -15, 56, 5);
  } else if (o.t === 'cow'){
    // vache d'Hérens (noire, cornes, cloche)
    ctx.fillStyle = '#2a1d18';
    ctx.fillRect(-30, -14, 6, 14); ctx.fillRect(-18, -14, 6, 14); ctx.fillRect(14, -14, 6, 14); ctx.fillRect(24, -14, 6, 14);
    ctx.beginPath(); ctx.ellipse(0, -28, 34, 17, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-36, -36, 12, 10, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a4034'; ctx.beginPath(); ctx.ellipse(-44, -32, 6, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#efe6d0'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-36,-44); ctx.quadraticCurveTo(-44,-54,-38,-58); ctx.moveTo(-32,-44); ctx.quadraticCurveTo(-26,-54,-30,-58); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-38,-38,1.8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d6a72a'; ctx.beginPath(); ctx.moveTo(-31,-24); ctx.lineTo(-25,-24); ctx.lineTo(-24,-14); ctx.lineTo(-32,-14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2a1d18'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(34,-32); ctx.quadraticCurveTo(42,-22,38,-12); ctx.stroke();
    ctx.lineCap = 'butt';
  }
  ctx.restore();
}

function drawWheel(){
  ctx.save();
  ctx.translate(m.x, m.y);
  if (m.inv > 0 && Math.floor(m.inv*20) % 2) ctx.globalAlpha = 0.5;
  ctx.rotate(m.a);
  const q = Math.PI*2 / PORTIONS;
  for (let i=0;i<PORTIONS;i++){
    if (i >= m.portions) continue;   // portion perdue
    const a0 = i*q, a1 = (i+1)*q;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath();
    ctx.fillStyle = '#f6d36b'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,R-2,a0+0.02,a1-0.02);
    ctx.strokeStyle = '#c9832c'; ctx.lineWidth = 4; ctx.stroke();
    // trous
    const mid = (a0+a1)/2;
    ctx.fillStyle = 'rgba(200,150,50,0.45)';
    ctx.beginPath(); ctx.arc(Math.cos(mid)*10, Math.sin(mid)*10, 2.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(Math.cos(mid+0.4)*15, Math.sin(mid+0.4)*15, 1.6, 0, Math.PI*2); ctx.fill();
    // découpe visible
    ctx.strokeStyle = 'rgba(180,120,40,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a0)*R, Math.sin(a0)*R); ctx.stroke();
  }
  // tampon « VS » au centre
  ctx.fillStyle = 'rgba(160,40,40,0.6)';
  ctx.font = '700 9px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (m.portions > 0) ctx.fillText('VS', 0, 0);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function render(){
  const viewW = W / S;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#6fb2e6'); sky.addColorStop(1,'#d8eefc');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  // montagnes lointaines (parallaxe, écran)
  ctx.setTransform(dpr*S,0,0,dpr*S,0,0);
  ctx.fillStyle = 'rgba(255,250,220,0.9)';
  ctx.beginPath(); ctx.arc(viewW*0.8, 80, 28, 0, Math.PI*2); ctx.fill();
  const py = -cam.y*0.03;
  mountains(cam.x*0.05, 330 + py, 190, '#8aa6c4', true, 1.3);
  mountains(cam.x*0.12, 420 + py*2, 140, '#6f8fae', true, 4.1);
  mountains(cam.x*0.25, 520 + py*3, 90, '#5d8a5f', false, 2.2);

  // monde
  let sx = 0, sy = 0;
  if (shake > 0){ sx = rnd(-6,6)*shake; sy = rnd(-6,6)*shake; }
  ctx.setTransform(dpr*S,0,0,dpr*S,(-cam.x+sx)*dpr*S,(-cam.y+sy)*dpr*S);

  const i0 = Math.max(0, Math.floor(cam.x/STEP) - 1);
  const i1 = Math.ceil((cam.x+viewW)/STEP) + 2;
  genTo(i1*STEP);

  // sapins d'arrière-plan
  for (const d of deco){
    if (!d.back || d.x < cam.x - 50 || d.x > cam.x + viewW + 50) continue;
    const by = groundAt(d.x) + 6;
    ctx.fillStyle = 'rgba(36,92,51,0.55)';
    ctx.beginPath(); ctx.moveTo(d.x - 14*d.s, by); ctx.lineTo(d.x, by - 60*d.s); ctx.lineTo(d.x + 14*d.s, by); ctx.closePath(); ctx.fill();
  }

  // terrain
  const bottom = cam.y + VH + 50;
  ctx.beginPath();
  ctx.moveTo(i0*STEP, bottom);
  for (let i=i0;i<=i1;i++) ctx.lineTo(i*STEP, gy[i]);
  ctx.lineTo(i1*STEP, bottom); ctx.closePath();
  const gg = ctx.createLinearGradient(0, cam.y, 0, cam.y + VH);
  gg.addColorStop(0, '#6fae4f'); gg.addColorStop(1, '#3f7a35');
  ctx.fillStyle = gg; ctx.fill();
  ctx.beginPath();
  for (let i=i0;i<=i1;i++){ i===i0 ? ctx.moveTo(i*STEP, gy[i]) : ctx.lineTo(i*STEP, gy[i]); }
  ctx.strokeStyle = '#9fd477'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();

  // pommes de terre
  for (const p of potatoes){
    if (p.got || p.x < cam.x - 20 || p.x > cam.x + viewW + 20) continue;
    const y = groundAt(p.x) - p.dy;
    ctx.fillStyle = '#c99550';
    ctx.beginPath(); ctx.ellipse(p.x, y, 10, 7.5, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8a6233';
    ctx.beginPath(); ctx.arc(p.x-3, y-1, 1.2, 0, Math.PI*2); ctx.arc(p.x+4, y+2, 1.2, 0, Math.PI*2); ctx.fill();
  }

  // obstacles
  for (const o of obstacles){
    if (o.x < cam.x - 120 || o.x > cam.x + viewW + 120) continue;
    drawObstacle(o);
  }

  if (state !== 'dead') drawWheel();
  // sapins de premier plan (décor, sans collision)
  for (const d of deco){
    if (d.back || d.x < cam.x - 50 || d.x > cam.x + viewW + 50) continue;
    const by = groundAt(d.x) + 40;
    ctx.fillStyle = '#1f4f2b';
    ctx.beginPath(); ctx.moveTo(d.x - 12*d.s, by); ctx.lineTo(d.x, by - 50*d.s); ctx.lineTo(d.x + 12*d.s, by); ctx.closePath(); ctx.fill();
  }

  for (const q of particles){
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life*1.5));
    ctx.fillStyle = q.c; ctx.fillRect(q.x - q.sz/2, q.y - q.sz/2, q.sz, q.sz);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts){
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life));
    ctx.font = '800 18px system-ui, sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.strokeText(t.s, t.x, t.y);
    ctx.fillStyle = t.col; ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  // lignes de vitesse
  const sp = Math.hypot(m.vx, m.vy);
  if (state === 'play' && sp > 600){
    ctx.strokeStyle = `rgba(255,255,255,${(sp-600)/900})`; ctx.lineWidth = 2;
    for (let i=0;i<5;i++){
      const ly = m.y + rnd(-60, 40), lx = m.x - rnd(40, 160);
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - rnd(30,70), ly - 8); ctx.stroke();
    }
  }

  // HUD
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = '#16324a'; ctx.font = '800 24px system-ui, sans-serif';
  ctx.fillText(score + ' m', 16, 14);
  // pommes de terre
  ctx.fillStyle = '#c99550'; ctx.beginPath(); ctx.ellipse(26, 58, 9, 7, 0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#16324a'; ctx.font = '700 17px system-ui, sans-serif';
  ctx.fillText('× ' + pots, 42, 49);
  // portions restantes
  for (let i=0;i<PORTIONS;i++){
    const cx = 26 + i*24, cy = 92;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, 9, -Math.PI/2, 0); ctx.closePath();
    ctx.fillStyle = i < m.portions ? '#f6d36b' : 'rgba(22,50,74,0.15)'; ctx.fill();
    if (i < m.portions){ ctx.strokeStyle = '#c9832c'; ctx.lineWidth = 2; ctx.stroke(); }
  }
  ctx.textAlign = 'right'; ctx.font = '600 14px system-ui, sans-serif'; ctx.fillStyle = 'rgba(22,50,74,0.75)';
  ctx.fillText('Record : ' + best + ' m', W-16, 18);

  if (state === 'ready' || state === 'dead'){
    ctx.fillStyle = 'rgba(10,30,50,0.5)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    if (state === 'ready'){
      ctx.font = '900 36px system-ui, sans-serif';
      ctx.fillText('RACLETTE RUSH', W/2, H*0.2);
      ctx.font = '400 16px system-ui, sans-serif';
      const lines = ['Ta meule dévale la montagne !', '', 'Touche l’écran pour sauter.', 'Appui court = petit saut, long = grand saut.', '', 'Chaque obstacle arrache une portion :', 'cailloux, barrières, sapins… et vaches (2 portions !).', 'Ramasse les pommes de terre.', '', 'Touche pour lâcher la meule'];
      lines.forEach((l,i) => ctx.fillText(l, W/2, H*0.2 + 60 + i*24));
    } else {
      ctx.font = '800 28px system-ui, sans-serif';
      ctx.fillText(deadMsg, W/2, H*0.32);
      ctx.font = '400 18px system-ui, sans-serif';
      ctx.fillText(score + ' m' + (score >= best && score > 0 ? '  — nouveau record !' : ''), W/2, H*0.32 + 48);
      ctx.fillText(pots + ' pommes de terre ramassées', W/2, H*0.32 + 78);
      if (deathT > 0.7) ctx.fillText('Touche pour rejouer', W/2, H*0.32 + 118);
    }
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(1/30, (now-last)/1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
